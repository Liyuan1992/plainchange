[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "change-passport-spike"
version = "0.1.0"
description = "Evidence-bound change brief experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
change-passport = "change_passport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
change_passport = ["templates/*.html", "templates/*.css", "templates/*.js", "assets/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
