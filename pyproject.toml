[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plainchange"
version = "0.1.0a1"
description = "Know what AI changed, what it affects, and what still needs verification"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
release = ["pyinstaller>=6.10,<7"]

[project.scripts]
plainchange = "plainchange.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plainchange = ["templates/*.html", "templates/*.css", "templates/*.js", "assets/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
